[package]
name = "xmip-core-provision-internal-ca"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-provision-internal-ca"
description = "The cluster's own certificate authority, issuing node certificates for server and client authentication, served over ACME. A xmip-core-provision technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md): the key, the certificate, the CSR, the trait.
provision = { workspace = true }
# The carrier (ADR-0044 clause 1), declared in architecture.toml: the
# authority serves the RFC 8555 objects and signed requests the client
# speaks, from the one copy of each.
acme = { workspace = true }
# An account's key, kept as its JWK and checked as ES256 by the estate's one
# JOSE, as the client signs with it.
jose = { workspace = true, features = ["key"] }
xcore = { workspace = true }
# Xmip's own HTTP and TLS: the requests the server answers, the http-01
# answer it asks for.
net = { workspace = true }
tls = { workspace = true }
codec = { workspace = true }
serde_json = "1"
# Accounts and who ordered what, kept in the authority's folder whole and
# synced (secret::private_file), as the register beside them.
secret = { workspace = true }
zeroize = "1"

[dev-dependencies]
# A loopback address no one holds, for what a test wants nothing listening
# at or binds later (`net::fixture::unheld`).
net = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
